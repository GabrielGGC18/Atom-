[project]
name = "atom-agent"
version = "0.1.0"
description = "ATOM - assistente pessoal local-first do Mestre Gabriel (inspirado em OpenJarvis)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gabriel" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.scripts]
atom = "atom.cli.main:app"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
